<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: draw under the notch/home bar; we pad with safe-area insets. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#141413" />
    <meta name="color-scheme" content="dark light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="311" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <script>
      // Pick the theme before the first paint, so there's no flash of the wrong one.
      // Dark unless the setting says otherwise (src/lib/theme.ts keeps it in sync).
      (function () {
        var pref = "dark";
        try {
          pref = localStorage.getItem("311-theme") || "dark";
        } catch (e) {}
        var light =
          pref === "light" ||
          (pref === "system" && matchMedia("(prefers-color-scheme: light)").matches);
        if (light) {
          document.documentElement.dataset.theme = "light";
          document.querySelector('meta[name="theme-color"]').content = "#F2F1EC";
        }
      })();
    </script>
    <!-- launch screens: generated by scripts/make-icons.mjs -->
