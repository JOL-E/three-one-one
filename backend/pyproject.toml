[project]
name = "three-one-one"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.3",
    "django-axes>=9.0.0",
    "django-ninja>=1.8.0",
    "django-oauth-toolkit>=3.4.1",
    "mcp>=2.3.0",
    "uvicorn>=0.54.0",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "django-stubs>=6.1.2",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-django>=4.14.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.test_settings"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# staticfiles/ exists only after collectstatic (in the image); tests don't need it.
filterwarnings = ["ignore:No directory at:UserWarning"]

[tool.ruff]
line-length = 110
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "DJ"]

[tool.mypy]
strict = true
plugins = ["mypy_django_plugin.main"]
exclude = ["^\\.venv/"]

[[tool.mypy.overrides]]
module = ["*.migrations.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["oauth2_provider.*"]  # django-oauth-toolkit ships no type hints
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.test_settings"
