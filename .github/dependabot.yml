# Weekly update pull requests. Minor and patch updates come grouped, one PR per
# ecosystem; major updates come one by one, since they're the ones that break.
version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    groups:
      python:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm:
        update-types: [minor, patch]
    ignore:
      # openapi-typescript needs TypeScript 5 (DECISIONS #58).
      - dependency-name: typescript
        versions: [">=6"]

  - package-ecosystem: docker # base images in the Dockerfile
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]
