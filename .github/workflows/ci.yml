# Checks every push. On main, and once a week, also builds and publishes the
# image for amd64 and arm64 (DECISIONS #53). The weekly build picks up security
# fixes in the base image even when the code hasn't changed.
name: CI

on:
  push:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v10 # gen:api asks the backend for its schema
      - run: npm ci
      - run: npx prettier --check .
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: API types match the backend
        run: npm run -s gen:api && git diff --exit-code -- src/api

  image:
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4 # runs the arm64 build steps emulated
      - uses: docker/setup-buildx-action@v4

      # First a quick amd64 build that must start and answer its health check,
      # so a broken image never becomes "latest".
      - name: Build for the smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          pull: true # the newest base images, for the weekly rebuild
          load: true
          tags: three-one-one:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name smoke -p 127.0.0.1:8000:8000 \
            -e SECRET_KEY=ci-only-not-secret -e BASE_URL=https://311.example.com \
            three-one-one:smoke
          for _ in $(seq 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' smoke)" = healthy ] && break
            sleep 2
          done
          docker logs smoke
          curl -fsS http://localhost:8000/api/health
          curl -fsS -o /dev/null http://localhost:8000/inbox/

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # latest, plus one tag per commit (sha-1a2b3c4) to roll back to.
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
      - name: Build and publish (amd64 + arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
