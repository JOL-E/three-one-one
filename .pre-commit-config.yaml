# Install once:  uv run --project backend pre-commit install --install-hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: end-of-file-fixer
        exclude: ^frontend/src/api/(openapi\.json|schema\.d\.ts)$  # generated
      - id: trailing-whitespace
        exclude: ^frontend/src/api/(openapi\.json|schema\.d\.ts)$
      - id: detect-private-key

  - repo: local
    hooks:
      - id: private-data
        name: no real data, nothing personal
        entry: python3 scripts/check_private_data.py
        language: system
        exclude: ^\.pre-commit-config\.yaml$

  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run --project backend ruff format
        language: system
        types: [python]
      - id: ruff
        name: ruff check
        entry: uv run --project backend ruff check --fix
        language: system
        types: [python]
      - id: mypy
        name: mypy (strict)
        entry: bash -c "cd backend && uv run mypy ."
        language: system
        files: ^backend/
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: bash -c "cd backend && uv run pytest -q"
        language: system
        files: ^backend/
        pass_filenames: false

  - repo: local
    hooks:
      - id: api-client
        name: API types match the backend (npm run gen:api)
        entry: bash -c "cd frontend && npm run -s gen:api >/dev/null && git diff --exit-code -- src/api"
        language: system
        files: ^backend/(inbox|config)/.*\.py$
        pass_filenames: false
      - id: frontend
        name: frontend (prettier, tsc, oxlint, vitest)
        entry: bash -c "cd frontend && npx prettier --check . >/dev/null && npm run -s typecheck && npm run -s lint && npm test -s"
        language: system
        files: ^frontend/
        pass_filenames: false
