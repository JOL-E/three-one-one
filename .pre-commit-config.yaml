# Install once:  uv run --project backend pre-commit install --install-hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key

  - repo: local
    hooks:
      - id: private-data
        name: no real data, nothing personal
        entry: python3 scripts/check_private_data.py
        language: system
        exclude: ^\.pre-commit-config\.yaml$

  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run --project backend ruff format
        language: system
        types: [python]
      - id: ruff
        name: ruff check
        entry: uv run --project backend ruff check --fix
        language: system
        types: [python]
      - id: mypy
        name: mypy (strict)
        entry: bash -c "cd backend && uv run mypy ."
        language: system
        files: ^backend/
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: bash -c "cd backend && uv run pytest -q"
        language: system
        files: ^backend/
        pass_filenames: false
